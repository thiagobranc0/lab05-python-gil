# Regenera o README.md e os gráficos quando muda o texto (docs/README.base.md) ou a análise,
# sem coletar de novo: usa a última execução válida em data/. Assim ninguém precisa rodar o build.py
# nem commitar o README à mão.
name: readme

on:
  push:
    branches: [main]
    paths:
      - "docs/README.base.md"
      - "src/analise.py"
      - "src/graficos.py"
      - "build.py"
      - "bench/config.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar README (análise, tabelas e gráficos)
        run: python build.py
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          [ -d images ] && git add images
          git diff --cached --quiet && { echo "README já estava atualizado"; exit 0; }
          git commit -m "docs: README regenerado (${GITHUB_SHA::7})"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
